<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keileamy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fredoka:wght@600;700&family=Quicksand:wght@400;600;700&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ffd36e;
    --pink: #ff8fb8;
    --text: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--text);
    /* Noche: negro con un leve resplandor azulado en el horizonte */
    background:
      radial-gradient(ellipse 120% 45% at 50% 108%, #0b1235 0%, rgba(11,18,53,0) 70%),
      #000;
    background-attachment: fixed;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
  }
  #stars, #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #stars { z-index: 0; overflow: hidden; }
  #confetti { z-index: 50; }

  /* ---------- Estrellas ---------- */
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    opacity: .35;
    animation: twinkle var(--d, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .star.s1 { width: 1px; height: 1px; }
  .star.s2 { width: 2px; height: 2px; box-shadow: 0 0 6px 1px rgba(255,255,255,.55); }
  .star.s3 { width: 3px; height: 3px; background: #fff7d6; box-shadow: 0 0 10px 3px rgba(255,240,180,.6); }
  .star.s3::before, .star.s3::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
    transform: translate(-50%, -50%);
  }
  .star.s3::before { width: 22px; height: 1px; }
  .star.s3::after { width: 1px; height: 22px; background: linear-gradient(180deg, transparent, rgba(255,255,255,.9), transparent); }
  .star.warm { background: #ffe9b8; }
  .star.cool { background: #bcd4ff; }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.35); } }

  .shooting {
    position: absolute; width: 130px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
    box-shadow: 0 0 8px 1px rgba(255,255,255,.6);
    opacity: 0;
    animation: shoot 1.3s ease-out forwards;
  }
  @keyframes shoot {
    0% { opacity: 0; transform: translate(0,0) rotate(28deg); }
    12% { opacity: 1; }
    100% { opacity: 0; transform: translate(320px, 170px) rotate(28deg); }
  }

  main {
    position: relative; z-index: 2;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .scene {
    display: none; width: 100%; max-width: 560px;
    flex-direction: column; align-items: center; text-align: center;
    animation: fadeUp .8s ease both;
  }
  .scene.active { display: flex; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  h1 { font-size: clamp(1.8rem, 7vw, 2.6rem); line-height: 1.2; margin-bottom: 10px; }
  .sub { opacity: .85; margin-bottom: 28px; font-size: 1.05rem; }

  button.btn {
    font: inherit; font-weight: 700; font-size: 1.05rem;
    background: linear-gradient(135deg, var(--accent), #ffb347);
    color: #3b1d5a; border: 0; border-radius: 999px;
    padding: 14px 30px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,190,80,.18);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button.btn:hover { transform: translateY(-2px) scale(1.03); }
  button.btn:active { transform: scale(.97); }

  /* ---------- Escena 1: regalo ---------- */
  .gift {
    font-size: 6rem; cursor: pointer; background: none; border: 0;
    animation: bounce 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(255,200,120,.35));
    margin-bottom: 20px;
  }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-16px) rotate(4deg); } }

  /* ---------- Escena 2: terminal ---------- */
  .terminal {
    width: 100%; text-align: left;
    background: rgba(8, 8, 18, .9);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,.6);
    margin-bottom: 24px;
  }
  .term-bar { display: flex; gap: 7px; padding: 10px 14px; background: rgba(255,255,255,.08); }
  .term-bar span { width: 12px; height: 12px; border-radius: 50%; }
  .term-bar span:nth-child(1) { background: #ff5f56; }
  .term-bar span:nth-child(2) { background: #ffbd2e; }
  .term-bar span:nth-child(3) { background: #27c93f; }
  .term-body {
    font-family: 'Fira Code', monospace; font-size: .9rem; line-height: 1.8;
    padding: 18px; min-height: 210px; color: #9dffb0;
  }
  .term-body .ok { color: var(--accent); }
  .cursor { display: inline-block; width: 8px; height: 1em; background: #9dffb0; vertical-align: middle; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #toCake { display: none; }

  /* ---------- Escena 3: pastel ---------- */
  .cake { position: relative; width: 300px; height: 270px; margin: 96px auto 14px; }
  .cake::before {
    content: ''; position: absolute; left: -40px; right: -40px; top: -40px; bottom: -10px;
    background: radial-gradient(ellipse at 50% 55%, rgba(255,190,90,.14), transparent 65%);
    pointer-events: none;
  }
  .cake svg { position: relative; display: block; }

  .numbers {
    position: absolute; left: 0; right: 0; bottom: 162px;
    display: flex; justify-content: center; align-items: flex-end; gap: 10px;
    z-index: 3;
  }
  .num { position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .num::before {
    content: ''; position: absolute; left: 50%; top: -34px; width: 110px; height: 110px;
    transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,180,70,.28), transparent 65%);
    transition: opacity .5s ease; pointer-events: none;
  }
  .num.out::before { opacity: 0; }
  .num span {
    display: block; position: relative;
    font-family: 'Fredoka', 'Quicksand', sans-serif; font-weight: 700;
    font-size: 88px; line-height: .8; height: 70px;
    background: repeating-linear-gradient(135deg, #ffffff 0 9px, #ff8fb8 9px 18px);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.45));
  }
  .wick { position: absolute; top: 8px; left: 50%; width: 2px; height: 7px; background: #2a1d14; transform: translateX(-50%); z-index: 2; }
  .flame {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 24px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: radial-gradient(circle at 50% 72%, #fff8d6, #ffb300 58%, #ff6a00);
    box-shadow: 0 0 20px 7px rgba(255,170,50,.55);
    animation: flicker .25s ease-in-out infinite alternate;
    transition: opacity .4s ease, transform .4s ease;
    z-index: 2;
  }
  @keyframes flicker { from { transform: translateX(-50%) scale(1, 1) rotate(-3deg); } to { transform: translateX(-50%) scale(.9, 1.12) rotate(3deg); } }
  .num.out .flame { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(.3); animation: none; }
  .smoke { position: absolute; top: -8px; left: 50%; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); opacity: 0; z-index: 2; }
  .num.out .smoke { animation: smoke 1.8s ease-out; }
  @keyframes smoke { 0% { opacity: .8; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-30%, -60px) scale(4); } }
  .hint { opacity: .8; min-height: 1.4em; margin-bottom: 18px; }

  @media (max-height: 720px) {
    .cake { transform: scale(.86); transform-origin: top center; margin: 84px auto -26px; }
  }

      <svg viewBox="0 0 300 270" width="300" height="270" aria-hidden="true">
        <defs>
          <radialGradient id="plateG" cx=".5" cy=".35" r=".75">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9a0c4"/>
          </radialGradient>
          <linearGradient id="choc" x1="0" x2="1">
            <stop offset="0" stop-color="#2a1409"/><stop offset=".3" stop-color="#6e3f24"/>
            <stop offset=".55" stop-color="#5a3019"/><stop offset="1" stop-color="#241107"/>
          </linearGradient>
          <linearGradient id="pink" x1="0" x2="1">
            <stop offset="0" stop-color="#c24a69"/><stop offset=".35" stop-color="#ffb0c6"/>
            <stop offset=".62" stop-color="#e8809d"/><stop offset="1" stop-color="#b03a59"/>
          </linearGradient>
          <linearGradient id="cream" x1="0" x2="1">
            <stop offset="0" stop-color="#e3d7c4"/><stop offset=".4" stop-color="#fffaf0"/>
            <stop offset=".6" stop-color="#ffffff"/><stop offset="1" stop-color="#ddd0bd"/>
          </linearGradient>
          <radialGradient id="topCream" cx=".45" cy=".4" r=".75">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3e3d0"/>
          </radialGradient>
          <radialGradient id="topPink" cx=".45" cy=".4" r=".75">
            <stop offset="0" stop-color="#fffaf5"/><stop offset="1" stop-color="#ffe0e9"/>
          </radialGradient>
          <radialGradient id="berry" cx=".35" cy=".3" r=".85">
            <stop offset="0" stop-color="#ff7a7a"/><stop offset=".7" stop-color="#d4202e"/><stop offset="1" stop-color="#8a0f1d"/>
          </radialGradient>
          <radialGradient id="dollop" cx=".4" cy=".3" r=".85">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eadccb"/>
          </radialGradient>
        </defs>

        <!-- Plato -->
        <ellipse cx="150" cy="238" rx="150" ry="24" fill="url(#plateG)"/>
        <ellipse cx="150" cy="238" rx="128" ry="17" fill="#ece7f6" opacity=".85"/>

        <!-- Piso inferior (chocolate) -->
        <path d="M40 150 V222 A110 22 0 0 0 260 222 V150 Z" fill="url(#choc)"/>
        <!-- Capas de crema -->
        <path d="M40 180 V187 A110 22 0 0 0 260 187 V180 A110 22 0 0 1 40 180 Z" fill="url(#cream)"/>
        <path d="M40 205 V212 A110 22 0 0 0 260 212 V205 A110 22 0 0 1 40 205 Z" fill="url(#cream)"/>
        <!-- Borde superior de crema -->
        <path d="M40 150 V160 A110 22 0 0 0 260 160 V150 A110 22 0 0 1 40 150 Z" fill="url(#cream)"/>
        <!-- Superficie del piso inferior -->
        <ellipse cx="150" cy="150" rx="110" ry="22" fill="url(#topCream)"/>
        <g id="pearls"></g>

        <!-- Piso superior (fresa) -->
        <path d="M80 102 V150 A70 14 0 0 0 220 150 V102 Z" fill="url(#pink)"/>
        <!-- Chorreado de crema -->
        <path d="M80 102 V122 a7 7 0 0 0 14 0 V113 h6 V127 a6 6 0 0 0 12 0 V114 h8 V136 a7 7 0 0 0 14 0 V114 h4 V121 a6 6 0 0 0 12 0 V115 h10 V131 a7 7 0 0 0 14 0 V114 h6 V125 a6 6 0 0 0 12 0 V113 h8 V133 a7 7 0 0 0 14 0 V113 h6 V102 Z"
              fill="#fffaf2" stroke="rgba(120,70,60,.18)" stroke-width="1"/>
        <!-- Superficie del piso superior -->
        <ellipse cx="150" cy="102" rx="70" ry="14" fill="url(#topPink)"/>

        <g id="ring"></g>
        <g id="berries"></g>
      </svg>

      <div class="numbers" id="candles">
        <div class="num" aria-label="Vela número 1">
          <div class="wick"></div><div class="flame"></div><div class="smoke"></div><span>1</span>
        </div>
        <div class="num" aria-label="Vela número 9">
          <div class="wick"></div><div class="flame"></div><div class="smoke"></div><span>9</span>
        </div>
      </div>
    </div>

    <p class="hint" id="hint"></p>
    <button class="btn" id="blowBtn">Soplaaaaa</button>
  </section>

  <!-- 4. Libro -->
  <section class="scene" id="s4">
    <h1>De mi pa ti</h1>
    <div class="book-wrap" id="book">
      <div class="book-top" id="pageNum">Página 1 de 1</div>
      <div class="page" id="page"></div>
      <button class="arrow prev" id="prev" aria-label="Página anterior"></button>
      <button class="arrow next" id="next" aria-label="Página siguiente"></button>
    </div>
    <button class="replay" id="replay">Volver a verlo</button>
  </section>
</main>

<script>
(function () {
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // =====================================================
  //  TEXTO DEL LIBRO  (cada elemento = una página)
  //  Edita aquí lo que quieras. Máx. ~280 caracteres por página.
  // =====================================================
  var pages = [
    "Feliz cumpleaños! \n\nEspero que hayas tenido un día muy bonito.\nSolo quiero que sepas que te aprecio mucho. Eres una persona que me ha sorprendido mucho con el pasar de los años.\nSin duda alguna y aunque tal vez no lo creas, tú marcaste un pedacito de mi vida y me has hecho ver las cosas desde otra perspectiva que nunca jamás pensé verlas.",

    "Admiro mucho tu forma ser y la manera en la que te enfocas cuando quieres conseguir algo.\nTe lo digo de corazón, tienes muchas cualidades que no he visto en otra persona.\n\nDisculpa sin en algún momento hice algo que no deberia, a veces disocio mucho y me voy pa otro mundo.",

    "Me parece increible que aun conservemos la amistad, litt llegamos a un punto de hablar 2 veces al año.. y era un cruce de 3 mensajes y ya.\n\nEso dice mucho de ti.. cualquier otra persona se va y ya. Créeme que valoro mucho eso.",

    "Y por último GRACIAS, por ser parte mi vida. Por cada conversación, por los momentos que hemos compartido y todas esas pequeñas cosas que uno no se da cuenta pero son muy significativas.",

    "Si en algún momento tal vez dejamos de hablar o nos distanciamos, quiero que siempre recuerdes que hubo alguien que se alegró de conocerte, que admiró muchas cosas de ti y que genuinamente deseó verte feliz y cumplir todo aquello que te propusieras. Por mi parte, me quedo con la alegría de haberte conocido y con la esperanza de que todavía nos queden muchas cosas bonitas por compartir, incluso si por ahora nos toca hacerlo desde la distancia.",

    "Pero eso no pasará, verdad? JEJE,\n\nBueno, ya mucho. Ya sabes que me cuesta mucho expresarme. Feliz Cumpleaños <3\n\n> deploy de felicitación:\n  exitoso ✔\n\nFin del libro.\nGracias por leerlo."
  ];

  // ---------- Estrellas de fondo ----------
  var starsBox = document.getElementById('stars');
  function addStars(count, cls) {
    for (var i = 0; i < count; i++) {
      var s = document.createElement('div');
      var tone = Math.random();
      s.className = 'star ' + cls + (tone < .15 ? ' warm' : tone < .3 ? ' cool' : '');
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 100) + '%';
      s.style.setProperty('--d', (2 + Math.random() * 5) + 's');
      s.style.setProperty('--delay', (Math.random() * 5) + 's');
      starsBox.appendChild(s);
    }
  }
  addStars(130, 's1');
  addStars(45, 's2');
  addStars(9, 's3');

  function shootingStar() {
    var s = document.createElement('div');
    s.className = 'shooting';
    s.style.left = (Math.random() * 65) + '%';
    s.style.top = (Math.random() * 35) + '%';
    starsBox.appendChild(s);
    setTimeout(function () { s.remove(); }, 1400);
  }
  if (!reduceMotion) {
    (function loop() {
      setTimeout(function () { shootingStar(); loop(); }, 5000 + Math.random() * 6000);
    })();
    setTimeout(shootingStar, 1800);
  }

  // ---------- Navegación entre escenas ----------
  function show(id) {
    document.querySelectorAll('.scene').forEach(function (el) { el.classList.remove('active'); });
    var el = document.getElementById(id);
    void el.offsetWidth;
    el.classList.add('active');
  }

  // ---------- Confeti ----------
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var pieces = [], running = false;
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener('resize', resize); resize();
  var colors = ['#ffd36e', '#ff8fb8', '#8fd3ff', '#b49bff', '#9dffb0', '#ffffff'];

  function burst(n, x, y) {
    for (var i = 0; i < n; i++) {
      pieces.push({
        x: x, y: y,
        vx: (Math.random() - .5) * 14,
        vy: Math.random() * -14 - 4,
        g: .28 + Math.random() * .1,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: colors[Math.floor(Math.random() * colors.length)],
        life: 0
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(function (p) { return p.y < canvas.height + 30 && p.life < 400; });
    pieces.forEach(function (p) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (pieces.length) requestAnimationFrame(tick); else running = false;
  }

  // ---------- Escena 1 → 2 ----------
  document.getElementById('giftBtn').addEventListener('click', function () {
    burst(80, innerWidth / 2, innerHeight / 2);
    setTimeout(function () { show('s2'); runTerminal(); }, 500);
  });

  // ---------- Terminal ----------
  var lines = [
    '> iniciando esta vaina.exe ...',
    '> cargando cositas..<span class="ok">[OK]</span>',
    '> buscando lo que no se me ha perdido <span class="ok">0 encontrados</span>',
    '> importando lo mas estupido que se me ocurra... <span class="ok">[OK]</span>',
    '> ejecutando mis pensamientos++ ...',
    '> compilación exitosa ✔'
  ];
  var termRunning = false;
  function runTerminal() {
    if (termRunning) return;
    termRunning = true;
    var term = document.getElementById('term');
    term.innerHTML = '';
    var i = 0;
    function next() {
      if (i >= lines.length) {
        term.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
        document.getElementById('toCake').style.display = 'inline-block';
        termRunning = false;
        return;
      }
      var div = document.createElement('div');
      div.innerHTML = lines[i++];
      term.appendChild(div);
      setTimeout(next, 750);
    }
    next();
  }
  document.getElementById('toCake').addEventListener('click', function () { show('s3'); });

  // ---------- Decoración del pastel (SVG) ----------
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }
  function rad(d) { return d * Math.PI / 180; }

  // Perlas de crema en la base
  var pearls = document.getElementById('pearls');
  for (var a = 8; a <= 172; a += 11) {
    var px = 150 + 110 * Math.cos(rad(a)), py = 222 + 22 * Math.sin(rad(a));
    el('circle', { cx: px.toFixed(1), cy: py.toFixed(1), r: 4.8, fill: 'url(#dollop)', stroke: 'rgba(0,0,0,.18)', 'stroke-width': .8 }, pearls);
  }

  // Rosetas de crema sobre el piso inferior
  var ring = document.getElementById('ring');
  [12, 34, 58, 82, 98, 122, 146, 168].forEach(function (ang) {
    var x = 150 + 97 * Math.cos(rad(ang)), y = 153 + 17 * Math.sin(rad(ang));
    var g = el('g', {}, ring);
    el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 6.8, fill: 'url(#dollop)', stroke: 'rgba(0,0,0,.15)', 'stroke-width': .8 }, g);
    el('circle', { cx: (x - 1).toFixed(1), cy: (y - 2.5).toFixed(1), r: 4.2, fill: '#fff', opacity: .85 }, g);
    el('circle', { cx: (x - 1.5).toFixed(1), cy: (y - 5).toFixed(1), r: 1.8, fill: '#fff' }, g);
  });

  // Fresas en el borde del piso superior
  var berries = document.getElementById('berries');
  [38, 72, 108, 142].forEach(function (ang) {
    var x = 150 + 58 * Math.cos(rad(ang)), y = 103 + 11 * Math.sin(rad(ang)) + 2;
    var g = el('g', { transform: 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')' }, berries);
    el('path', { d: 'M0 -6 C 8 -9 10 2 0 9 C -10 2 -8 -9 0 -6 Z', fill: 'url(#berry)', stroke: 'rgba(80,0,10,.35)', 'stroke-width': .6 }, g);
    el('path', { d: 'M-5 -6 L-2 -9 L0 -6.5 L2 -9 L5 -6 L0 -4 Z', fill: '#3c9d3f' }, g);
    [[-3, -1], [2, -2], [0, 2], [-2, 4], [3, 2]].forEach(function (s) {
      el('circle', { cx: s[0], cy: s[1], r: .8, fill: '#ffe7a3' }, g);
    });
  });

  // ---------- Escena 3: velas con el número 19 ----------
  var candles = document.querySelectorAll('.num');
  var done = false;
  function checkAll() {
    if (done) return;
    var left = document.querySelectorAll('.num:not(.out)').length;
    var hint = document.getElementById('hint');
    if (left === 0) {
      done = true;
      hint.textContent = 'Ojala se te cumpla';
      burst(160, innerWidth / 2, innerHeight * .6);
      setTimeout(function () { burst(100, innerWidth * .2, innerHeight * .7); burst(100, innerWidth * .8, innerHeight * .7); }, 400);
      setTimeout(function () { show('s4'); startBook(); }, 2300);
    } else {
      hint.textContent = 'Falta' + (left === 1 ? ' 1 vela' : 'n ' + left + ' velas') + '...';
    }
  }
  candles.forEach(function (c) {
    c.addEventListener('click', function () { c.classList.add('out'); checkAll(); });
  });
  document.getElementById('blowBtn').addEventListener('click', function () {
    candles.forEach(function (c, i) { setTimeout(function () { c.classList.add('out'); checkAll(); }, i * 350); });
  });

  // ---------- Escena 4: libro estilo Minecraft ----------
  var bookEl = document.getElementById('book');
  var pageEl = document.getElementById('page');
  var pageNum = document.getElementById('pageNum');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var cur = 0, timer = null, visited = {};

  function finishTyping() {
    if (timer) { clearInterval(timer); timer = null; }
    pageEl.classList.remove('typing');
    visited[cur] = true;
  }

  function renderPage(i, animate) {
    if (timer) finishTyping();
    cur = i;
    pageEl.textContent = '';
    pageNum.textContent = 'Página ' + (i + 1) + ' de ' + pages.length;
    prevBtn.style.visibility = i === 0 ? 'hidden' : 'visible';
    nextBtn.style.visibility = i === pages.length - 1 ? 'hidden' : 'visible';

    if (animate && !reduceMotion) {
      pageEl.classList.remove('turn');
      void pageEl.offsetWidth;
      pageEl.classList.add('turn');
    }

    var txt = pages[i];
    if (visited[i] || reduceMotion) {
      pageEl.textContent = txt;
      pageEl.classList.remove('typing');
      visited[i] = true;
      return;
    }
    var n = 0;
    pageEl.classList.add('typing');
    timer = setInterval(function () {
      n++;
      pageEl.textContent = txt.slice(0, n);
      if (n >= txt.length) {
        finishTyping();
        if (i === pages.length - 1) burst(70, innerWidth / 2, innerHeight * .55);
      }
    }, 24);
  }

  function goTo(i) {
    if (i < 0 || i > pages.length - 1 || i === cur) return;
    if (timer) { pageEl.textContent = pages[cur]; finishTyping(); }
    renderPage(i, true);
  }
  // Calcula un tamaño de letra único con el que cabe la página más larga
  function fitFont() {
    var w = bookEl.clientWidth;
    if (!w) return;
    var saved = pageEl.textContent, best = 5.5;
    pages.forEach(function (t) {
      var sz = 5.5;
      pageEl.textContent = t;
      for (; sz > 3.6; sz -= 0.1) {
        pageEl.style.fontSize = (sz * w / 100) + 'px';
        if (pageEl.scrollHeight <= pageEl.clientHeight + 1) break;
      }
      if (sz < best) best = sz;
    });
    pageEl.style.fontSize = (best * w / 100) + 'px';
    pageEl.textContent = saved;
  }
  function startBook() { visited = {}; fitFont(); renderPage(0, false); }
  addEventListener('resize', function () {
    if (document.getElementById('s4').classList.contains('active')) { fitFont(); renderPage(cur, false); }
  });

  prevBtn.addEventListener('click', function () { goTo(cur - 1); });
  nextBtn.addEventListener('click', function () { goTo(cur + 1); });
  pageEl.addEventListener('click', function () {
    if (timer) { pageEl.textContent = pages[cur]; finishTyping(); }
  });
  addEventListener('keydown', function (e) {
    if (!document.getElementById('s4').classList.contains('active')) return;
    if (e.key === 'ArrowRight') goTo(cur + 1);
    if (e.key === 'ArrowLeft') goTo(cur - 1);
  });
  var touchX = null;
  bookEl.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  bookEl.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 45) goTo(dx < 0 ? cur + 1 : cur - 1);
  }, { passive: true });

  // ---------- Reiniciar ----------
  document.getElementById('replay').addEventListener('click', function () {
    if (timer) finishTyping();
    candles.forEach(function (c) { c.classList.remove('out'); });
    done = false;
    document.getElementById('hint').textContent = '';
    document.getElementById('toCake').style.display = 'none';
    show('s1');
  });
})();
</script>
</body>
</html>
